<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escritos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(
        circle at 50% 35%,
        #30312d 0%,
        #191a18 45%,
        #0c0d0c 100%
    );
    color: #eee9df;
}

/* =========================
   PORTADA
========================= */

.portada {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    z-index: 10;

    transition:
        opacity 1.4s ease,
        transform 1.4s ease,
        filter 1.4s ease;
}

.portada.saliendo {
    opacity: 0;
    transform: scale(1.08);
    filter: blur(8px);
    pointer-events: none;
}

/* =========================
   PARTICULAS
========================= */

.particula {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    animation: flotar 6s ease-in-out infinite;
}

.p1 {
    top: 18%;
    left: 20%;
    animation-delay: 1s;
}

.p2 {
    top: 30%;
    right: 17%;
    animation-delay: 2s;
}

.p3 {
    bottom: 23%;
    left: 25%;
    animation-delay: 3s;
}

.p4 {
    bottom: 18%;
    right: 25%;
    animation-delay: 0.5s;
}

.p5 {
    top: 48%;
    left: 12%;
    animation-delay: 1.5s;
}

.p6 {
    top: 55%;
    right: 12%;
    animation-delay: 2.5s;
}

@keyframes flotar {
    0%,
    100% {
        transform: translateY(0);
        opacity: 0.15;
    }

    50% {
        transform: translateY(-14px);
        opacity: 0.65;
    }
}

/* =========================
   PORTADA - TEXTOS
========================= */

.marca {
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: #aaa69d;
    margin-bottom: 26px;
    text-align: center;
}

.fecha {
    font-family: Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 5px;
    color: #d2c8b6;
    text-align: center;
}

.separador {
    width: 150px;
    height: 1px;
    margin: 35px auto 30px;

    background: linear-gradient(
        to right,
        transparent,
        rgba(210, 200, 180, 0.55),
        transparent
    );
}

.frase {
    text-align: center;
    max-width: 450px;
    margin-bottom: 8px;
}

.frase p {
    font-size: 25px;
    line-height: 1.55;
    font-style: italic;
    color: #e6dfd2;
}

.puntos {
    margin-top: 17px;
    font-size: 27px;
    letter-spacing: 9px;
    color: #b8ad99;
}

/* =========================
   BOTON ABRIR
========================= */

.boton-abrir {
    margin-top: 38px;
    padding: 13px 29px;

    border-radius: 30px;
    border: 1px solid rgba(220, 210, 190, 0.32);

    background: rgba(255, 255, 255, 0.035);
    color: #ddd5c7;

    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 4px;

    cursor: pointer;

    transition: all 0.4s ease;

    backdrop-filter: blur(8px);

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

.boton-abrir:hover {
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(220, 210, 190, 0.65);

    transform: translateY(-3px);

    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
}

.boton-abrir:active {
    transform: translateY(0);
}

/* =========================
   CONTENIDO
========================= */

.contenido {
    position: fixed;
    inset: 0;

    z-index: 2;

    overflow-y: auto;

    opacity: 0;
    transform: translateY(25px);

    pointer-events: none;

    transition:
        opacity 1.4s ease,
        transform 1.4s ease;

    background: radial-gradient(
        circle at 50% 10%,
        #30312d 0%,
        #191a18 48%,
        #0c0d0c 100%
    );
}

.contenido.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

/* =========================
   CABECERA
========================= */

.cabecera {
    width: 100%;
    max-width: 900px;

    margin: auto;

    padding: 50px 25px 25px;

    text-align: center;
}

.logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: 7px;

    color: #aaa69d;

    margin-bottom: 18px;

    font-style: italic;
}

.linea {
    width: 100%;
    max-width: 700px;

    height: 1px;

    margin: 25px auto 0;

    background: linear-gradient(
        to right,
        transparent,
        rgba(210, 200, 180, 0.25),
        transparent
    );
}

/* =========================
   VOLVER
========================= */

.volver {
    display: inline-flex;
    align-items: center;

    gap: 7px;

    margin-top: 14px;

    padding: 5px 10px;

    border: none;
    background: transparent;

    color: #77736b;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;

    cursor: pointer;

    transition:
        color 0.4s ease,
        transform 0.4s ease;
}

.volver span {
    font-size: 15px;
    line-height: 1;

    color: #9d9588;

    transition: transform 0.4s ease;
}

.volver:hover {
    color: #c8c0b4;
}

.volver:hover span {
    transform: translateX(-3px);
}

/* =========================
   ENTRADA
========================= */

.entrada {
    width: calc(100% - 40px);
    max-width: 700px;

    margin: 35px auto 35px;

    padding: 45px 40px;

    position: relative;

    background: rgba(255, 255, 255, 0.035);

    border: 1px solid rgba(255, 255, 255, 0.08);

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);

    backdrop-filter: blur(8px);
}

.entrada-fecha {
    font-family: Arial, sans-serif;

    font-size: 10px;
    letter-spacing: 4px;

    color: #9d9588;

    text-align: center;

    margin-bottom: 38px;
}

.entrada-texto {
    text-align: center;

    font-size: 27px;
    line-height: 1.75;

    font-style: italic;

    color: #e8e0d3;
}

.estrella {
    text-align: center;

    margin: 35px 0;

    color: #b7aa94;

    font-size: 15px;
}

.nota {
    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 10px;
    letter-spacing: 3px;

    color: #77736b;

    text-transform: uppercase;
}

/* =========================
   CANAL WHATSAPP
========================= */

.canal-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;

    width: fit-content;

    gap: 9px;

    margin: 0 auto 42px;

    padding: 7px 12px 7px 8px;

    text-decoration: none;

    color: #aaa69d;

    background: rgba(255, 255, 255, 0.025);

    border: 1px solid rgba(255, 255, 255, 0.07);

    border-radius: 30px;

    transition: all 0.35s ease;
}

.canal-whatsapp:hover {
    color: #d8d0c2;

    background: rgba(255, 255, 255, 0.055);

    border-color: rgba(255, 255, 255, 0.14);

    transform: translateY(-1px);
}

.whatsapp-icon {
    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #25D366;

    flex-shrink: 0;
}

.whatsapp-icon svg {
    width: 15px;
    height: 15px;

    fill: white;
}

.texto-canal {
    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 1.5px;

    text-transform: uppercase;

    white-space: nowrap;
}

.flecha-canal {
    font-family: Arial, sans-serif;

    font-size: 15px;
    line-height: 1;

    color: #77736b;

    margin-left: 1px;
}

/* =========================
   CONTROL MUSICA
========================= */

.control-musica {
    position: fixed;

    right: 25px;
    bottom: 25px;

    width: 43px;
    height: 43px;

    border-radius: 50%;

    border: 1px solid rgba(220, 210, 190, 0.25);

    background: rgba(20, 20, 18, 0.7);

    color: #d8d0c2;

    cursor: pointer;

    font-size: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform: translateY(15px);

    pointer-events: none;

    transition: all 0.6s ease;

    backdrop-filter: blur(8px);

    z-index: 50;
}

.control-musica.visible {
    opacity: 1;

    transform: translateY(0);

    pointer-events: auto;
}

.control-musica:hover {
    background: rgba(255, 255, 255, 0.08);

    transform: scale(1.05);
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;

    padding-bottom: 50px;

    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 3px;

    color: #625f59;
}

/* =========================
   ANIMACIONES
========================= */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.contenido.visible .cabecera {
    animation: aparecer 1.4s ease 0.3s both;
}

.contenido.visible .entrada {
    animation: aparecer 1.5s ease 0.6s both;
}

.contenido.visible .canal-whatsapp {
    animation: aparecer 1.5s ease 0.85s both;
}

.contenido.visible .footer {
    animation: aparecer 1.5s ease 1s both;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .marca {
        font-size: 10px;
        letter-spacing: 5px;
    }

    .fecha {
        font-size: 12px;
        letter-spacing: 4px;
    }

    .frase p {
        font-size: 21px;
    }

    .entrada {
        padding: 38px 25px;
    }

    .entrada-texto {
        font-size: 22px;
    }

    .canal-whatsapp {
        max-width: calc(100% - 30px);
    }

    .control-musica {
        right: 18px;
        bottom: 18px;
    }
}
</style>
</head>

<!-- =========================
     BOTON MUSICA
========================= -->

<button
    class="control-musica"
    id="controlMusica"
    onclick="controlarMusica()"
    title="Música">

    ♫

</button>


<script>

/* =========================
   ELEMENTOS
========================= */

const portada = document.getElementById("portada");
const contenido = document.getElementById("contenido");
const musica = document.getElementById("musica");
const controlMusica = document.getElementById("controlMusica");
const botonAbrir = document.getElementById("botonAbrir");


/* =========================
   ABRIR ESCRITOS
========================= */

function abrirEscritos() {

    musica.volume = 0.35;

    musica.play()
        .then(() => {

            controlMusica.innerHTML = "♫";

        })
        .catch((error) => {

            console.log(
                "No se pudo reproducir el audio:",
                error
            );

            controlMusica.innerHTML = "♫";

        });


    portada.classList.add("saliendo");


    setTimeout(() => {

        contenido.classList.add("visible");

        controlMusica.classList.add("visible");

    }, 650);


    botonAbrir.disabled = true;
}


/* =========================
   VOLVER AL INICIO
========================= */

function volverInicio() {

    contenido.classList.remove("visible");

    controlMusica.classList.remove("visible");


    setTimeout(() => {

        portada.classList.remove("saliendo");

        botonAbrir.disabled = false;

    }, 500);
}


/* =========================
   CONTROL DE MUSICA
========================= */

function controlarMusica() {

    if (musica.paused) {

        musica.play()
            .then(() => {

                controlMusica.innerHTML = "♫";

            })
            .catch((error) => {

                console.log(
                    "No se pudo reproducir el audio:",
                    error
                );

            });

    } else {

        musica.pause();

        controlMusica.innerHTML = "🔇";

    }
}


/* =========================
   EVENTOS DEL AUDIO
========================= */

musica.addEventListener("pause", function () {

    controlMusica.innerHTML = "🔇";

});


musica.addEventListener("play", function () {

    controlMusica.innerHTML = "♫";

});

</script>

</body>
</html>
