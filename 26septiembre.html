<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escritos</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    font-family: Georgia, "Times New Roman", serif;

    background: radial-gradient(
        circle at 50% 35%,
        #243447 0%,
        #17202a 45%,
        #0b1118 100%
    );

    color: #eef3f7;
}


/* =========================
   NIEVE
   SOLO PORTADA
========================= */

.nieve {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 20;

    opacity: 1;

    transition:
        opacity 1.2s ease;
}

.nieve.oculta {

    opacity: 0;
}

.copo {

    position: absolute;

    top: -20px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.85);

    box-shadow:
        0 0 5px rgba(255, 255, 255, 0.45),
        0 0 10px rgba(150, 210, 235, 0.20);

    animation-name: caerNieve;

    animation-timing-function: linear;

    animation-iteration-count: infinite;
}

@keyframes caerNieve {

    0% {

        transform:
            translate3d(0, -20px, 0)
            rotate(0deg);

        opacity: 0;
    }

    10% {

        opacity: 0.85;
    }

    50% {

        transform:
            translate3d(35px, 50vh, 0)
            rotate(180deg);

        opacity: 0.75;
    }

    100% {

        transform:
            translate3d(-30px, 110vh, 0)
            rotate(360deg);

        opacity: 0;
    }
}


/* =========================
   PORTADA
========================= */

.portada {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 30px;

    z-index: 10;

    transition:
        opacity 1.4s ease,
        transform 1.4s ease,
        filter 1.4s ease;
}

.portada.saliendo {

    opacity: 0;

    transform: scale(1.08);

    filter: blur(8px);

    pointer-events: none;
}


/* =========================
   PARTICULAS
========================= */

.particula {

    position: absolute;

    width: 3px;

    height: 3px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.35);

    animation:
        flotar 6s ease-in-out infinite;
}

.p1 {

    top: 18%;

    left: 20%;

    animation-delay: 1s;
}

.p2 {

    top: 30%;

    right: 17%;

    animation-delay: 2s;
}

.p3 {

    bottom: 23%;

    left: 25%;

    animation-delay: 3s;
}

.p4 {

    bottom: 18%;

    right: 25%;

    animation-delay: 0.5s;
}

.p5 {

    top: 48%;

    left: 12%;

    animation-delay: 1.5s;
}

.p6 {

    top: 55%;

    right: 12%;

    animation-delay: 2.5s;
}

@keyframes flotar {

    0%,
    100% {

        transform: translateY(0);

        opacity: 0.15;
    }

    50% {

        transform: translateY(-14px);

        opacity: 0.65;
    }
}


/* =========================
   PORTADA - TEXTOS
========================= */

.marca {

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 7px;

    text-transform: uppercase;

    color: #9fb3c8;

    margin-bottom: 26px;

    text-align: center;
}

.fecha {

    font-family: Arial, sans-serif;

    font-size: 14px;

    letter-spacing: 5px;

    color: #c7d8e8;

    text-align: center;
}

.separador {

    width: 150px;

    height: 1px;

    margin: 35px auto 30px;

    background: linear-gradient(
        to right,
        transparent,
        rgba(135, 190, 225, 0.55),
        transparent
    );
}

.frase {

    text-align: center;

    max-width: 450px;

    margin-bottom: 8px;
}

.frase p {

    font-size: 25px;

    line-height: 1.55;

    font-style: italic;

    color: #e4edf5;
}

.puntos {

    margin-top: 17px;

    font-size: 27px;

    letter-spacing: 9px;

    color: #8fb8d6;
}


/* =========================
   BOTON ABRIR
========================= */

.boton-abrir {

    margin-top: 38px;

    padding: 13px 29px;

    border-radius: 30px;

    border: 1px solid rgba(120, 185, 225, 0.32);

    background: rgba(130, 190, 225, 0.055);

    color: #d8e6f2;

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 4px;

    cursor: pointer;

    transition:
        all 0.4s ease;

    backdrop-filter: blur(8px);

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.16),
        0 0 0 rgba(80, 170, 215, 0);
}

.boton-abrir:hover {

    background: rgba(255, 255, 255, 0.09);

    border-color: rgba(120, 185, 225, 0.65);

    transform: translateY(-3px);

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.25),
        0 0 22px rgba(80, 170, 215, 0.10);
}

.boton-abrir:active {

    transform: translateY(0);
}


/* =========================
   CONTENIDO
========================= */

.contenido {

    position: fixed;

    inset: 0;

    z-index: 2;

    overflow-y: auto;

    opacity: 0;

    transform: translateY(25px);

    pointer-events: none;

    transition:
        opacity 1.4s ease,
        transform 1.4s ease;

    background: radial-gradient(
        circle at 50% 10%,
        #243447 0%,
        #17202a 48%,
        #0b1118 100%
    );
}

.contenido.visible {

    opacity: 1;

    transform: translateY(0);

    pointer-events: auto;
}


/* =========================
   CABECERA
========================= */

.cabecera {

    width: 100%;

    max-width: 900px;

    margin: auto;

    padding: 50px 25px 25px;

    text-align: center;
}

.logo {

    font-family: Georgia, "Times New Roman", serif;

    font-size: 13px;

    letter-spacing: 7px;

    color: #9fb3c8;

    margin-bottom: 18px;

    font-style: italic;
}

.linea {

    width: 100%;

    max-width: 700px;

    height: 1px;

    margin: 25px auto 0;

    background: linear-gradient(
        to right,
        transparent,
        rgba(120, 185, 225, 0.25),
        transparent
    );
}


/* =========================
   VOLVER
========================= */

.volver {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-top: 14px;

    padding: 5px 10px;

    border: none;

    background: transparent;

    color: #71879b;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
        color 0.4s ease,
        transform 0.4s ease;
}

.volver span {

    font-size: 15px;

    line-height: 1;

    color: #8ba8bd;

    transition:
        transform 0.4s ease;
}

.volver:hover {

    color: #b9d5e8;
}

.volver:hover span {

    transform: translateX(-3px);
}


/* =========================
   ENTRADA
========================= */

.entrada {

    width: calc(100% - 40px);

    max-width: 700px;

    margin: 35px auto 35px;

    padding: 45px 40px;

    position: relative;

    background: rgba(130, 190, 225, 0.055);

    border: 1px solid rgba(120, 185, 225, 0.14);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.24),
        inset 0 1px 0 rgba(150, 210, 235, 0.035);

    backdrop-filter: blur(8px);
}

.entrada-fecha {

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 4px;

    color: #8ba8bd;

    text-align: center;

    margin-bottom: 38px;
}

.entrada-texto {

    text-align: center;

    font-size: 27px;

    line-height: 1.75;

    font-style: italic;

    color: #e5eef6;
}

.estrella {

    text-align: center;

    margin: 35px 0;

    color: #86b9d8;

    font-size: 15px;

    text-shadow:
        0 0 18px rgba(95, 180, 220, 0.25);
}

.nota {

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 3px;

    color: #71879b;

    text-transform: uppercase;
}


/* =========================
   CANAL WHATSAPP
========================= */

.canal-whatsapp {

    display: flex;

    align-items: center;

    justify-content: center;

    width: fit-content;

    gap: 9px;

    margin: 0 auto 42px;

    padding: 7px 12px 7px 8px;

    text-decoration: none;

    color: #9fb3c8;

    background: rgba(130, 190, 225, 0.035);

    border: 1px solid rgba(255, 255, 255, 0.07);

    border-radius: 30px;

    transition:
        all 0.35s ease;
}

.canal-whatsapp:hover {

    color: #d5e7f4;

    background: rgba(130, 190, 225, 0.08);

    border-color: rgba(130, 190, 225, 0.20);

    transform: translateY(-1px);
}

.whatsapp-icon {

    width: 25px;

    height: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #25D366;

    flex-shrink: 0;
}

.whatsapp-icon svg {

    width: 15px;

    height: 15px;

    fill: white;
}

.texto-canal {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    white-space: nowrap;
}

.flecha-canal {

    font-family: Arial, sans-serif;

    font-size: 15px;

    line-height: 1;

    color: #71879b;

    margin-left: 1px;
}


/* =========================
   CONTROL MUSICA
========================= */

.control-musica {

    position: fixed;

    right: 25px;

    bottom: 25px;

    width: 43px;

    height: 43px;

    border-radius: 50%;

    border: 1px solid rgba(120, 185, 225, 0.25);

    background: rgba(10, 22, 34, 0.78);

    color: #d5e7f4;

    cursor: pointer;

    font-size: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    transform: translateY(15px);

    pointer-events: none;

    transition:
        all 0.6s ease;

    backdrop-filter: blur(8px);

    z-index: 50;
}

.control-musica.visible {

    opacity: 1;

    transform: translateY(0);

    pointer-events: auto;
}

.control-musica:hover {

    background: rgba(130, 190, 225, 0.12);

    transform: scale(1.05);
}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    padding-bottom: 50px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: #5e7488;
}


/* =========================
   ANIMACIONES
========================= */

@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(20px);
    }

    to {

        opacity: 1;

        transform: translateY(0);
    }
}

.contenido.visible .cabecera {

    animation:
        aparecer 1.4s ease 0.3s both;
}

.contenido.visible .entrada {

    animation:
        aparecer 1.5s ease 0.6s both;
}

.contenido.visible .canal-whatsapp {

    animation:
        aparecer 1.5s ease 0.85s both;
}

.contenido.visible .footer {

    animation:
        aparecer 1.5s ease 1s both;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .marca {

        font-size: 10px;

        letter-spacing: 5px;
    }

    .fecha {

        font-size: 12px;

        letter-spacing: 4px;
    }

    .frase p {

        font-size: 21px;
    }

    .entrada {

        padding: 38px 25px;
    }

    .entrada-texto {

        font-size: 22px;
    }

    .canal-whatsapp {

        max-width: calc(100% - 30px);
    }

    .control-musica {

        right: 18px;

        bottom: 18px;
    }
}


/* =========================
   BRILLO AZUL SUTIL
========================= */

.portada::before,
.contenido::before {

    content: "";

    position: absolute;

    width: 420px;

    height: 420px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(72, 150, 190, 0.10),
            transparent 68%
        );

    pointer-events: none;

    filter: blur(8px);
}

.portada::before {

    top: 8%;

    right: 8%;
}

.contenido::before {

    top: 0;

    left: 5%;
}

</style>

</head>

     NIEVE
     SOLO PORTADA
========================= -->

    id="nieve">
</div>

    <!-- =========================

    ========================= -->

    <footer class="footer">

</main>

<script>

/* =========================
   ELEMENTOS
========================= */

const portada =
    document.getElementById("portada");

const contenido =
    document.getElementById("contenido");

const musica =
    document.getElementById("musica");

const controlMusica =
    document.getElementById("controlMusica");

const botonAbrir =
    document.getElementById("botonAbrir");

const nieve =
    document.getElementById("nieve");


/* =========================
   VARIABLE NIEVE
========================= */

let intervaloNieve;


/* =========================
   CREAR NIEVE
========================= */

function crearNieve() {

    /*
       Si la nieve está oculta,
       no crear nuevos copos.
    */

    if (
        nieve.classList.contains("oculta")
    ) {

        return;

    }


    const copo =
        document.createElement("span");


    copo.className =
        "copo";


    /* =========================
       TAMAÑO
    ========================= */

    const tamanio =
        Math.random() * 4 + 2;


    copo.style.width =
        tamanio + "px";

    copo.style.height =
        tamanio + "px";


    /* =========================
       POSICION
    ========================= */

    copo.style.left =
        Math.random() * 100 + "%";


    /* =========================
       VELOCIDAD
    ========================= */

    const duracion =
        Math.random() * 8 + 7;


    copo.style.animationDuration =
        duracion + "s";


    /* =========================
       RETRASO
    ========================= */

    copo.style.animationDelay =
        Math.random() * 8 + "s";


    /* =========================
       OPACIDAD
    ========================= */

    copo.style.opacity =
        Math.random() * 0.6 + 0.25;


    /* =========================
       AGREGAR
    ========================= */

    nieve.appendChild(copo);


    /* =========================
       LIMPIAR
    ========================= */

    setTimeout(() => {

        copo.remove();

    }, (duracion + 8) * 1000);

}


/* =========================
   INICIAR NIEVE
========================= */

function iniciarNieve() {


    clearInterval(
        intervaloNieve
    );


    nieve.classList.remove(
        "oculta"
    );


    /* Crear nieve inicial */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        crearNieve();

    }


    /* Crear nieve continuamente */

    intervaloNieve =
        setInterval(
            crearNieve,
            250
        );

}


/* =========================
   DETENER NIEVE
========================= */

function detenerNieve() {


    /* Detener generación */

    clearInterval(
        intervaloNieve
    );


    /* Desvanecer */

    nieve.classList.add(
        "oculta"
    );


    /*
       Después de la transición,
       eliminar todos los copos.
    */

    setTimeout(() => {

        nieve.innerHTML = "";

    }, 1200);

}


/* =========================
   INICIAR AL CARGAR
========================= */

iniciarNieve();


/* =========================
   ABRIR ESCRITOS
========================= */

function abrirEscritos() {


    /* =========================
       DETENER NIEVE
    ========================= */

    detenerNieve();


    /* =========================
       MUSICA
    ========================= */

    musica.volume = 0.35;


    musica.play()

        .then(() => {

            controlMusica.innerHTML =
                "♫";

        })

        .catch((error) => {

            console.log(
                "No se pudo reproducir el audio:",
                error
            );

            controlMusica.innerHTML =
                "♫";

        });


    /* =========================
       SALIDA DE PORTADA
    ========================= */

    portada.classList.add(
        "saliendo"
    );


    /* =========================
       MOSTRAR CONTENIDO
    ========================= */

    setTimeout(() => {

        contenido.classList.add(
            "visible"
        );

        controlMusica.classList.add(
            "visible"
        );

    }, 650);


    botonAbrir.disabled =
        true;

}


/* =========================
   VOLVER AL INICIO
========================= */

function volverInicio() {


    /* =========================
       OCULTAR CONTENIDO
    ========================= */

    contenido.classList.remove(
        "visible"
    );


    controlMusica.classList.remove(
        "visible"
    );


    /* =========================
       VOLVER A PORTADA
    ========================= */

    setTimeout(() => {


        portada.classList.remove(
            "saliendo"
        );


        botonAbrir.disabled =
            false;


        /* =========================
           VOLVER A ACTIVAR NIEVE
        ========================= */

        iniciarNieve();


    }, 500);

}


/* =========================
   CONTROL DE MUSICA
========================= */

function controlarMusica() {


    if (
        musica.paused
    ) {


        musica.play()

            .then(() => {

                controlMusica.innerHTML =
                    "♫";

            })

            .catch((error) => {

                console.log(
                    "No se pudo reproducir el audio:",
                    error
                );

            });


    } else {


        musica.pause();


        controlMusica.innerHTML =
            "🔇";

    }

}


/* =========================
   EVENTOS DEL AUDIO
========================= */

musica.addEventListener(
    "pause",
    function () {

        controlMusica.innerHTML =
            "🔇";

    }
);


musica.addEventListener(
    "play",
    function () {

        controlMusica.innerHTML =
            "♫";

    }
);

</script>
